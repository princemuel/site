#:tombi schema.strict = false
#:schema https://www.schemastore.org/fly.json
# fly.toml app configuration file generated for princemuel on 2026-04-22T03:35:46+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app            = "princemuel"
primary_region = "lhr"

[build]
dockerfile = "Dockerfile"

[deploy]
release_command = "yarn db:migrate"
strategy        = "rolling"

[[services]]
auto_stop_machines   = "suspend"
internal_port        = 8080
min_machines_running = 1
processes            = ["app"]

[[services.ports]]
force_https = true
handlers    = ["http"]
port        = 80

[services.ports.http_options.response.headers]
X-Process-Group = "app"

[[services.ports]]
handlers = ["tls", "http"]
port     = 443

[services.ports.http_options.response.headers]
X-Process-Group = "app"

[[vm]]
cpu_kind  = "shared"
cpus      = 1
memory    = "1gb"
processes = ["app"]
